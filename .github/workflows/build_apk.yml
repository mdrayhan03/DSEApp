name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle' # Caches Gradle dependencies for Android builds

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true # Caches Flutter SDK downloads and engine artifacts
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Install Poetry
        run: pip install poetry

      - name: Cache Poetry Virtualenv & Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install Dependencies
        run: poetry install

      - name: Build APK
        run: poetry run flet build apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dse-app-apk
          path: build/apk/*.apk