name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # Caching Flutter SDK downloaded directly by Flet CLI
      - name: Cache Flet Flutter SDK
        uses: actions/cache@v4
        with:
          path: ~/.flet
          key: ${{ runner.os }}-flet-flutter-sdk

      - name: Install Poetry
        run: pip install poetry

      - name: Cache Poetry Virtualenv & Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install Dependencies
        run: poetry install --no-root

      - name: Build APK
        # Added -y / --no-interactive flag so Flet auto-approves installing its required Flutter version
        run: poetry run flet build apk --no-interactive

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dse-app-apk
          path: build/apk/*.apk